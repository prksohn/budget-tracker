<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in</title>

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/components/header.css" />
    <link rel="stylesheet" href="css/pages/login.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://db.onlinewebfonts.com/c/ab85de357512affb46d18df06fdaa4d9?family=Petite+Mort+WEB"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1 class="login-logo">BUT</h1>
    </header>

    <main class="login-main">
      <section class="login-section">
        <div class="login-content">
          <h3 class="login-title">로그인</h3>

          <p class="login-description">소셜 계정으로 간편하게 로그인하세요.</p>

          <div class="social-login">
            <button type="button" class="social-button">
              <span>Kakao로 로그인</span>
            </button>

            <button type="button" class="social-button">
              <span>Naver로 로그인</span>
            </button>

            <button type="button" class="social-button">
              <span>Google로 로그인</span>
            </button>
          </div>

          <p class="login-notice">
            로그인 후 가계부 서비스를 이용할 수 있습니다.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
